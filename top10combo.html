<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beyblade X Top 10 Combo</title>
  <!-- top10combo fixed: 2026-07-03 v6 -->
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --line: #d9e1ec;
      --text: #111827;
      --muted: #6b7280;
      --red: #d11a2a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px 12px 28px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      font-size: 16px;
    }

    .wrap {
      width: min(680px, 100%);
      margin: 0 auto;
    }

    .filters {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 38px;
      align-items: center;
      gap: 8px;
    }

    .filter-row label {
      font-weight: 800;
      text-align: right;
      white-space: nowrap;
    }

    select {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: white;
      color: #111827;
      font-size: 15px;
      font-weight: 700;
      outline: none;
    }

    .clear-btn {
      width: 36px;
      height: 36px;
      border: 1px solid #e5e7eb;
      border-radius: 9px;
      background: white;
      color: #111827;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .clear-btn:disabled {
      color: #d1d5db;
      background: #f8fafc;
      cursor: default;
    }

    .list {
      display: grid;
      gap: 7px;
    }

    .combo-row {
      display: grid;
      grid-template-columns: 42px minmax(120px, 1fr) 90px 132px;
      align-items: center;
      min-height: 42px;
      padding: 8px 10px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 9px;
      font-weight: 800;
    }

    .rank {
      text-align: right;
      padding-right: 8px;
      color: #000;
    }

    .blade {
      text-align: center;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .combo {
      text-align: center;
      letter-spacing: .2px;
      white-space: nowrap;
    }

    .stat {
      text-align: center;
      white-space: nowrap;
      font-size: 15px;
    }

    .selected-term {
      color: var(--red);
    }

    .empty, .loading, .error {
      text-align: center;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 16px;
      font-weight: 700;
    }

    .error { color: var(--red); }

    @media (max-width: 520px) {
      body { padding: 12px 8px 22px; font-size: 15px; }
      .wrap { width: 100%; }
      .filter-row { grid-template-columns: 44px minmax(0, 1fr) 34px; gap: 7px; }
      .filter-row label { font-size: 15px; }
      select { height: 38px; font-size: 14px; padding: 0 8px; }
      .clear-btn { width: 33px; height: 33px; font-size: 19px; }

      .combo-row {
        grid-template-columns: 32px minmax(84px, 1fr) 76px 108px;
        min-height: 40px;
        padding: 7px 6px;
        column-gap: 2px;
        font-size: 14px;
      }

      .rank { padding-right: 4px; }
      .blade { text-align: center; }
      .combo { text-align: center; }
      .stat { font-size: 13px; text-align: center; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="filters" aria-label="篩選條件">
      <div class="filter-row">
        <label for="bladeSelect">上蓋</label>
        <select id="bladeSelect"></select>
        <button class="clear-btn" id="clearBlade" type="button" aria-label="清除上蓋">×</button>
      </div>

      <div class="filter-row">
        <label for="ratchetSelect">固鎖</label>
        <select id="ratchetSelect"></select>
        <button class="clear-btn" id="clearRatchet" type="button" aria-label="清除固鎖">×</button>
      </div>

      <div class="filter-row">
        <label for="bitSelect">軸心</label>
        <select id="bitSelect"></select>
        <button class="clear-btn" id="clearBit" type="button" aria-label="清除軸心">×</button>
      </div>
    </section>

    <section id="results" class="list">
      <div class="loading">讀取 data.json 中...</div>
    </section>
  </main>

  <script>
    const DATA_URL = "data.json?v=" + Date.now();

    const state = {
      blade: "",
      ratchet: "",
      bit: ""
    };

    let rows = [];

    const els = {
      blade: document.getElementById("bladeSelect"),
      ratchet: document.getElementById("ratchetSelect"),
      bit: document.getElementById("bitSelect"),
      clearBlade: document.getElementById("clearBlade"),
      clearRatchet: document.getElementById("clearRatchet"),
      clearBit: document.getElementById("clearBit"),
      results: document.getElementById("results")
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalize(value) {
      return String(value ?? "").trim();
    }

    function cleanBladeName(value) {
      let s = normalize(value);

      // 去掉尾端產品型號，例如：魔導神杖 UX-03、蒼穹龍騎士 BX-34、翔龍神劍 BXG-53
      s = s.replace(/\s+(?:BX|UX|CX|BXG|BXH|BXC|BXA|BXK|BXP|BXW)-\d{1,3}(?:[._-]?\d{1,2})?$/i, "");

      // 去掉括號內純型號，例如：魔導神杖 (UX-03)
      s = s.replace(/\s*[（(](?:BX|UX|CX|BXG|BXH|BXC|BXA|BXK|BXP|BXW)-\d{1,3}(?:[._-]?\d{1,2})?[）)]\s*$/i, "");

      return s.trim();
    }

    function isChampion(rank) {
      const r = normalize(rank).toLowerCase();
      return r === "1st" || r === "1" || r.includes("冠軍");
    }

    function parseDateValue(value) {
      const raw = normalize(value);
      if (!raw) return 0;
      const time = Date.parse(raw.replaceAll("/", "-"));
      return Number.isFinite(time) ? time : 0;
    }

    function buildRows(rawData) {
      return rawData.map((r, index) => {
        const blade = cleanBladeName(r["上蓋"] || r["blade"] || r["Blade"] || "");
        const ratchet = normalize(r["固鎖"] || r["ratchet"] || r["Ratchet"] || "");
        const bit = normalize(r["軸"] || r["軸心"] || r["bit"] || r["Bit"] || "");
        return {
          id: index,
          blade,
          ratchet,
          bit,
          rank: normalize(r["名次"] || r["rank"] || r["Rank"] || ""),
          dateValue: parseDateValue(r["日期"] || r["date"] || r["Date"] || "")
        };
      }).filter(r => r.blade || r.ratchet || r.bit);
    }

    function filteredData(exceptField = "") {
      return rows.filter(r => {
        if (exceptField !== "blade" && state.blade && r.blade !== state.blade) return false;
        if (exceptField !== "ratchet" && state.ratchet && r.ratchet !== state.ratchet) return false;
        if (exceptField !== "bit" && state.bit && r.bit !== state.bit) return false;
        return true;
      });
    }

    function countOptions(field) {
      const data = filteredData(field);
      const map = new Map();
      for (const r of data) {
        const key = r[field];
        if (!key) continue;
        map.set(key, (map.get(key) || 0) + 1);
      }
      return Array.from(map.entries())
        .sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), "zh-Hant"));
    }

    function fillSelect(selectEl, field, label) {
      const current = state[field];
      const options = countOptions(field);
      const valid = !current || options.some(([value]) => value === current);
      if (!valid) state[field] = "";

      selectEl.innerHTML = "";
      const all = document.createElement("option");
      all.value = "";
      all.textContent = `${label}：全部`;
      selectEl.appendChild(all);

      for (const [value, count] of options) {
        const opt = document.createElement("option");
        opt.value = value;
        opt.textContent = `${value} (${count})`;
        selectEl.appendChild(opt);
      }
      selectEl.value = state[field];
    }

    function updateSelects() {
      fillSelect(els.blade, "blade", "上蓋");
      fillSelect(els.ratchet, "ratchet", "固鎖");
      fillSelect(els.bit, "bit", "軸心");

      els.clearBlade.disabled = !state.blade;
      els.clearRatchet.disabled = !state.ratchet;
      els.clearBit.disabled = !state.bit;
    }

    function getComboText(g) {
      return `${g.ratchet || ""}${g.bit || ""}`;
    }

    function groupResults() {
      const map = new Map();
      for (const r of filteredData()) {
        const key = `${r.blade}\u0001${r.ratchet}\u0001${r.bit}`;
        if (!map.has(key)) {
          map.set(key, {
            blade: r.blade,
            ratchet: r.ratchet,
            bit: r.bit,
            total: 0,
            champion: 0,
            latest: 0
          });
        }
        const g = map.get(key);
        g.total += 1;
        if (isChampion(r.rank)) g.champion += 1;
        if (r.dateValue > g.latest) g.latest = r.dateValue;
      }
      return Array.from(map.values())
        .sort((a, b) => b.total - a.total || b.champion - a.champion || b.latest - a.latest)
        .slice(0, 10);
    }

    function renderName(blade) {
      const cls = state.blade && blade === state.blade ? "selected-term" : "";
      return `<span class="${cls}">${escapeHtml(blade)}</span>`;
    }

    function renderCombo(g) {
      const ratchetCls = state.ratchet && g.ratchet === state.ratchet ? "selected-term" : "";
      const bitCls = state.bit && g.bit === state.bit ? "selected-term" : "";
      return `<span class="${ratchetCls}">${escapeHtml(g.ratchet)}</span><span class="${bitCls}">${escapeHtml(g.bit)}</span>`;
    }

    function renderResults() {
      const groups = groupResults();
      els.results.innerHTML = "";

      if (groups.length === 0) {
        els.results.innerHTML = `<div class="empty">沒有符合條件的組合</div>`;
        return;
      }

      groups.forEach((g, index) => {
        const row = document.createElement("div");
        row.className = "combo-row";
        row.innerHTML = `
          <div class="rank">${index + 1}.</div>
          <div class="blade">${renderName(g.blade)}</div>
          <div class="combo">${renderCombo(g)}</div>
          <div class="stat">${g.total}次(冠軍${g.champion}次)</div>
        `;
        els.results.appendChild(row);
      });
    }

    function refresh() {
      updateSelects();
      renderResults();
    }

    els.blade.addEventListener("change", () => { state.blade = els.blade.value; refresh(); });
    els.ratchet.addEventListener("change", () => { state.ratchet = els.ratchet.value; refresh(); });
    els.bit.addEventListener("change", () => { state.bit = els.bit.value; refresh(); });

    els.clearBlade.addEventListener("click", () => { state.blade = ""; refresh(); });
    els.clearRatchet.addEventListener("click", () => { state.ratchet = ""; refresh(); });
    els.clearBit.addEventListener("click", () => { state.bit = ""; refresh(); });

    fetch(DATA_URL)
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(data => {
        rows = buildRows(Array.isArray(data) ? data : []);
        refresh();
      })
      .catch(error => {
        console.error(error);
        els.results.innerHTML = `<div class="error">讀不到 data.json，請確認 top10combo.html 跟 data.json 放在同一層。</div>`;
      });
  </script>
</body>
</html>
