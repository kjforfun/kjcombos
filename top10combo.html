<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Best 10 Combos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: #f6f7f8;
      color: #050505;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 12px 10px 24px;
    }
    .filters {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 12px;
      position: sticky;
      top: 0;
      z-index: 5;
      background: #f6f7f8;
      padding: 6px 0 9px;
    }
    .filter {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 28px;
      gap: 4px;
      align-items: center;
      min-width: 0;
    }
    select {
      width: 100%;
      height: 36px;
      padding: 0 8px;
      border: 1px solid #cfd4dc;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      font-weight: 700;
      min-width: 0;
    }
    .clear {
      width: 28px;
      height: 36px;
      border: 1px solid #d8dde5;
      border-radius: 8px;
      background: #fff;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }
    .clear:disabled {
      opacity: .22;
      cursor: default;
    }
    .list {
      display: grid;
      gap: 5px;
    }
    .row {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) 58px;
      align-items: center;
      gap: 8px;
      min-height: 39px;
      padding: 7px 10px;
      border: 1px solid #e1e6ed;
      border-radius: 9px;
      background: #fff;
      font-size: 15px;
      line-height: 1.15;
    }
    .rank {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 850;
    }
    .combo {
      width: min(100%, 420px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(7em, 1fr) 90px;
      gap: 16px;
      align-items: baseline;
      font-weight: 850;
      min-width: 0;
    }
    .blade-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
    }
    .part-code {
      white-space: nowrap;
      text-align: left;
      font-variant-numeric: tabular-nums;
      letter-spacing: .15px;
    }
    .stats {
      white-space: nowrap;
      text-align: right;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }
    .hit {
      color: #d00000;
      font-weight: 950;
    }
    .empty, .error {
      padding: 12px;
      border-radius: 9px;
      background: #fff;
      text-align: center;
      font-size: 14px;
    }
    .empty { border: 1px dashed #aaa; color: #555; }
    .error { border: 1px solid #e29; color: #a00038; font-weight: 750; }

    @media (max-width: 520px) {
      .wrap { padding: 7px 5px 18px; }
      .filters { gap: 4px; }
      .filter { grid-template-columns: minmax(0, 1fr) 24px; gap: 2px; }
      select { height: 34px; padding: 0 3px; font-size: 11px; border-radius: 7px; }
      .clear { width: 24px; height: 34px; font-size: 16px; border-radius: 7px; }
      .row {
        grid-template-columns: 28px minmax(0, 1fr) 48px;
        gap: 5px;
        min-height: 36px;
        padding: 6px 6px;
        font-size: 13px;
      }
      .combo {
        width: min(100%, 292px);
        grid-template-columns: minmax(7em, 1fr) 72px;
        gap: 8px;
      }
      .stats { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="filters">
      <div class="filter">
        <select id="bladeSelect" aria-label="上蓋"></select>
        <button class="clear" id="clearBlade" title="清除上蓋">×</button>
      </div>
      <div class="filter">
        <select id="ratchetSelect" aria-label="固鎖"></select>
        <button class="clear" id="clearRatchet" title="清除固鎖">×</button>
      </div>
      <div class="filter">
        <select id="bitSelect" aria-label="軸心"></select>
        <button class="clear" id="clearBit" title="清除軸心">×</button>
      </div>
    </div>
    <div id="list" class="list"><div class="empty">讀取 data.json...</div></div>
  </main>

  <script>
    // v4: reads ./data.json, strips product model codes from blade names, highlights selected filters.
    let rawData = [];

    const fields = {
      blade: { key: "上蓋", fallbackKey: "英文", label: "上蓋", select: document.getElementById("bladeSelect"), clear: document.getElementById("clearBlade") },
      ratchet: { key: "固鎖", label: "固鎖", select: document.getElementById("ratchetSelect"), clear: document.getElementById("clearRatchet") },
      bit: { key: "軸", label: "軸心", select: document.getElementById("bitSelect"), clear: document.getElementById("clearBit") }
    };

    const listEl = document.getElementById("list");

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[ch]));
    }

    function clean(value) {
      return String(value ?? "")
        .replace(/\u00a0/g, " ")
        .replace(/[　]+/g, " ")
        .trim();
    }

    function cleanBlade(value) {
      let s = clean(value);

      // Remove product model codes like BX-34, UX-03, CX-08₁, BXG-57, BXH-22, BXC-19, BXA-06.
      // Example: 蒼穹龍騎士 BX-34 -> 蒼穹龍騎士
      s = s.replace(/\s*(?:BXA|BXB|BXC|BXG|BXH|BXK|BXR|BXP|BX|UX|CX)-\d+(?:[-_./]?\d+)?[A-Za-z₀₁₂₃₄₅₆₇₈₉⁰¹²³⁴⁵⁶⁷⁸⁹]*/gi, "");

      // Also remove model code in brackets if the source ever has that format.
      s = s.replace(/[（(]\s*(?:BXA|BXB|BXC|BXG|BXH|BX|UX|CX)-\d+[^）)]*[）)]/gi, "");

      return s.replace(/\s{2,}/g, " ").trim();
    }

    function getFieldValue(row, fieldId) {
      const f = fields[fieldId];
      let value = clean(row[f.key]);
      if (!value && f.fallbackKey) value = clean(row[f.fallbackKey]);
      return fieldId === "blade" ? cleanBlade(value) : value;
    }

    function isChampion(row) {
      const rank = clean(row["名次"]).toLowerCase();
      return rank === "1st" || rank === "1" || rank === "冠軍" || rank.includes("champion");
    }

    function dateValue(text) {
      const s = clean(text);
      if (!s) return 0;
      const parts = s.split(/[\/\-.]/).map(Number);
      if (parts.length < 3 || parts.some(Number.isNaN)) return 0;
      return new Date(parts[0], parts[1] - 1, parts[2]).getTime();
    }

    function getState() {
      return {
        blade: fields.blade.select.value,
        ratchet: fields.ratchet.select.value,
        bit: fields.bit.select.value
      };
    }

    function rowMatches(row, state, ignoreField = null) {
      for (const fieldId of Object.keys(fields)) {
        if (fieldId === ignoreField) continue;
        if (state[fieldId] && getFieldValue(row, fieldId) !== state[fieldId]) return false;
      }
      return true;
    }

    function countOptions(fieldId, state) {
      const counts = new Map();
      for (const row of rawData) {
        if (!rowMatches(row, state, fieldId)) continue;
        const value = getFieldValue(row, fieldId);
        if (!value) continue;
        counts.set(value, (counts.get(value) || 0) + 1);
      }
      return [...counts.entries()].sort((a, b) =>
        (b[1] - a[1]) || String(a[0]).localeCompare(String(b[0]), "zh-Hant", { numeric: true })
      );
    }

    function setSelectOptions(fieldId, options, selectedValue) {
      const f = fields[fieldId];
      const select = f.select;
      select.innerHTML = "";

      const all = document.createElement("option");
      all.value = "";
      all.textContent = `${f.label}：全部`;
      select.appendChild(all);

      for (const [value, count] of options) {
        const opt = document.createElement("option");
        opt.value = value;
        opt.textContent = `${value} (${count})`;
        select.appendChild(opt);
      }

      select.value = selectedValue;
      f.clear.disabled = !selectedValue;
    }

    function updateFilters() {
      const state = getState();
      let changed = true;
      let guard = 0;

      while (changed && guard < 12) {
        changed = false;
        guard++;
        for (const fieldId of Object.keys(fields)) {
          const values = new Set(countOptions(fieldId, state).map(([value]) => value));
          if (state[fieldId] && !values.has(state[fieldId])) {
            state[fieldId] = "";
            changed = true;
          }
        }
      }

      for (const fieldId of Object.keys(fields)) {
        setSelectOptions(fieldId, countOptions(fieldId, state), state[fieldId]);
      }
    }

    function filteredRows() {
      const state = getState();
      return rawData.filter(row => rowMatches(row, state));
    }

    function comboKey(row) {
      return [getFieldValue(row, "blade"), getFieldValue(row, "ratchet"), getFieldValue(row, "bit")].join("||");
    }

    function comboName(row) {
      return `${getFieldValue(row, "blade")} ${getFieldValue(row, "ratchet")}${getFieldValue(row, "bit")}`;
    }

    function hitSpan(value, active) {
      return `<span${active ? " class=\"hit\"" : ""}>${esc(value)}</span>`;
    }

    function comboHtml(row, state) {
      const blade = getFieldValue(row, "blade") || "未命名";
      const ratchet = getFieldValue(row, "ratchet");
      const bit = getFieldValue(row, "bit");

      return `
        <div class="blade-name">${hitSpan(blade, !!state.blade && blade === state.blade)}</div>
        <div class="part-code">${hitSpan(ratchet, !!state.ratchet && ratchet === state.ratchet)}${hitSpan(bit, !!state.bit && bit === state.bit)}</div>
      `;
    }

    function buildTop10(rows) {
      const map = new Map();

      for (const row of rows) {
        const blade = getFieldValue(row, "blade");
        const ratchet = getFieldValue(row, "ratchet");
        const bit = getFieldValue(row, "bit");
        if (!blade || !ratchet || !bit) continue;

        const key = comboKey(row);
        if (!map.has(key)) {
          map.set(key, { sample: row, total: 0, first: 0, latest: 0 });
        }

        const item = map.get(key);
        item.total += 1;
        if (isChampion(row)) item.first += 1;
        item.latest = Math.max(item.latest, dateValue(row["日期"]));
      }

      return [...map.values()].sort((a, b) =>
        (b.total - a.total) ||
        (b.first - a.first) ||
        (b.latest - a.latest) ||
        comboName(a.sample).localeCompare(comboName(b.sample), "zh-Hant", { numeric: true })
      ).slice(0, 10);
    }

    function renderList() {
      const state = getState();
      const top = buildTop10(filteredRows());

      if (!top.length) {
        listEl.innerHTML = `<div class="empty">沒有符合條件</div>`;
        return;
      }

      listEl.innerHTML = top.map((item, index) => `
        <div class="row">
          <div class="rank">${index + 1}.</div>
          <div class="combo">${comboHtml(item.sample, state)}</div>
          <div class="stats">🏆${item.first}/${item.total}</div>
        </div>
      `).join("");
    }

    function update() {
      updateFilters();
      renderList();
    }

    function initEmptyFilters() {
      for (const fieldId of Object.keys(fields)) setSelectOptions(fieldId, [], "");
    }

    async function loadData() {
      initEmptyFilters();

      try {
        const response = await fetch(`data.json?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("data.json 不是陣列格式");

        rawData = data.map(row => ({ ...row }));
        update();
      } catch (err) {
        console.error(err);
        listEl.innerHTML = `<div class="error">讀不到 data.json。確認 top10combo.html 跟 data.json 在同一層。</div>`;
      }
    }

    for (const [fieldId, f] of Object.entries(fields)) {
      f.select.addEventListener("change", update);
      f.clear.addEventListener("click", () => {
        f.select.value = "";
        update();
      });
    }

    loadData();
  </script>
</body>
</html>
