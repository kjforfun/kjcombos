const $=id=>document.getElementById(id);const norm=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[‐‑‒–—−]/g,'-').replace(/\s+/g,'').trim();const ratchetKey=s=>norm(s).replace(/-/g,'');const partText=r=>r.part||'-';const escapeHtml=s=>String(s??'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));function mark(s,q){const raw=String(s??''),query=String(q??'').trim();if(!query)return escapeHtml(raw);const safe=query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{return escapeHtml(raw).replace(new RegExp(`(${safe})`,'ig'),'<span class="hl">$1</span>')}catch{return escapeHtml(raw)}}function parseQuery(q){const raw=norm(q),compact=raw.replace(/-/g,''),combo=compact.match(/^(\d+)([a-z]+)$/i);return{raw,compact,combo}}function rowMatches(r,q,type){const p=parseQuery(q);if(!p.compact)return true;const rr=ratchetKey(r.ratchet),rb=norm(r.bit);if(p.combo)return rr===p.combo[1]&&rb===p.combo[2];if(type==='ratchet')return rr.includes(p.compact);if(type==='bit')return rb===p.compact;if(/^[0-9]+$/.test(p.compact)||/^\d+-\d+$/.test(p.raw))return rr.includes(p.compact);if(/^[a-z]+$/i.test(p.compact))return rb===p.compact;return false}function pickedSpan(text,on,cls){const content=escapeHtml(text||'');return `<span class="${cls}${on?' picked':''}">${content}</span>`}function highlightTarget(r,q,type){const p=parseQuery(q);if(!p.compact)return{ratchet:false,bit:false};const rr=ratchetKey(r.ratchet),rb=norm(r.bit);if(p.combo)return{ratchet:rr===p.combo[1],bit:rb===p.combo[2]};if(type==='ratchet')return{ratchet:rr.includes(p.compact),bit:false};if(type==='bit')return{ratchet:false,bit:rb===p.compact};if(/^[0-9]+$/.test(p.compact)||/^\d+-\d+$/.test(p.raw))return{ratchet:rr.includes(p.compact),bit:false};if(/^[a-z]+$/i.test(p.compact))return{ratchet:false,bit:rb===p.compact};return{ratchet:false,bit:false}}function renderPart(r,q,type){const h=highlightTarget(r,q,type);if(!r.ratchet)return `<span class="part onlyBit">${pickedSpan(r.bit,h.bit,'bitCell')}</span>`;return `<span class="part">${pickedSpan(r.ratchet,h.ratchet,'ratchetCell')}${pickedSpan(r.bit,h.bit,'bitCell')}</span>`}function filterRows(){const q=$('q').value,type=$('type').value;if(!parseQuery(q).compact)return DATA;return DATA.filter(r=>rowMatches(r,q,type))}function sortRows(rows){return[...rows].sort((a,b)=>a.code.localeCompare(b.code,'en',{numeric:true})||a.name.localeCompare(b.name,'zh-Hant'))}function render(){const q=$('q').value,typeText=$('type').selectedOptions[0].textContent,rows=sortRows(filterRows()),setCount=new Set(rows.map(r=>r.code)).size,partCount=new Set(rows.map(partText)).size;$('countAll').textContent=DATA.length;$('countNow').textContent=rows.length;$('countSets').textContent=setCount;$('countParts').textContent=partCount;$('summary').innerHTML=q.trim()?`查詢 <b>${escapeHtml(q)}</b>（${typeText}）：找到 <b>${rows.length}</b> 筆，分布在 <b>${setCount}</b> 個盒組。`:`目前顯示全部資料，共 <b>${DATA.length}</b> 筆。`;$('empty').style.display=rows.length?'none':'block';$('tableWrap').style.display=rows.length?'':'none';$('mobileList').style.display=rows.length?'':'none';$('tbody').innerHTML=rows.map(r=>`<tr><td><span class="code">${escapeHtml(r.code)}</span></td><td>${escapeHtml(r.name)}</td><td>${renderPart(r,q,$('type').value)}</td></tr>`).join('');$('mobileList').innerHTML=rows.map(r=>`<article class="mRow"><span class="code">${escapeHtml(r.code)}</span><span class="muted">${escapeHtml(r.name)}</span>${renderPart(r,q,$('type').value)}</article>`).join('')}function makeSuggestions(){const values=new Set([...FIXED_QUICK.bits,...FIXED_QUICK.ratchets]);DATA.forEach(r=>{if(r.bit)values.add(r.bit);if(r.ratchet){values.add(r.ratchet);values.add(ratchetKey(r.ratchet))}});$('suggestions').innerHTML=[...values].sort((a,b)=>String(a).localeCompare(String(b),'zh-Hant',{numeric:true})).map(v=>`<option value="${escapeHtml(v)}"></option>`).join('')}function makeChips(){const groups=[['軸心',FIXED_QUICK.bits],['固鎖',FIXED_QUICK.ratchets]];$('chips').innerHTML=groups.map(([name,arr])=>`<div class="chipGroup"><span class="chipGroupTitle">${name}</span>${arr.map(v=>`<span class="chip" data-type="${name==='固鎖'?'ratchet':'bit'}" data-v="${escapeHtml(v)}">${escapeHtml(v)}</span>`).join('')}</div>`).join('');document.querySelectorAll('.chip').forEach(chip=>chip.addEventListener('click',()=>{$('q').value=chip.dataset.v;$('type').value=chip.dataset.type;render();window.scrollTo({top:0,behavior:'smooth'})}))}$('q').addEventListener('input',render);$('type').addEventListener('change',render);$('searchBtn').addEventListener('click',render);$('clearBtn').addEventListener('click',()=>{$('q').value='';$('type').value='auto';render()});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('clearBtn').click()});makeSuggestions();makeChips();render();
